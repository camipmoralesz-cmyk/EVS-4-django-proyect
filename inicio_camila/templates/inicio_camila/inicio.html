{% extends 'base.html' %}
{% load static %}

{% block title %}Inicio{% endblock %}

{% block content %}
<div class="container px-4 py-5" id="featured-3">
    <h2 class="pb-2 border-bottom">Elige un género</h2>

    <div class="row g-4 py-5 row-cols-1 row-cols-lg-2">
        {% for g in generos %}
        <div class="feature col">
            <div class="feature-icon d-inline-flex align-items-center justify-content-center text-bg-primary bg-gradient fs-2 mb-3 rounded-3 p-3">
                <i class="bi bi-film"></i>
            </div>
            <h3 class="fs-2">{{ g.nombre }}</h3>
            <p>{{ g.descripcion }}</p>
            <a href="{% url 'inicio_camila:genero' g.nombre %}" class="icon-link"> #<!-- cambiamos las rutas de la de la app de inicio_camila a la app de inicio_camila -->
                Ver películas
                <i class="bi bi-chevron-right"></i>
            </a>
        </div>
        {% empty %}
        <p>No hay géneros disponibles.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
